spring:
  application:
    name: wealthora-auth-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wealthora}
    username: ${DATABASE_USERNAME:wealthora}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

wealthora:
  owner-bootstrap:
    full-name: ${WEALTHORA_OWNER_NAME:}
    email: ${WEALTHORA_OWNER_EMAIL:}
    password: ${WEALTHORA_OWNER_PASSWORD:}
  registration:
    requires-admin-approval: ${REGISTRATION_REQUIRES_ADMIN_APPROVAL:false}
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}
    verification-expiry: PT10M
    resend-cooldown: PT1M
    maximum-verification-attempts: 5
  security:
    token-pepper: ${TOKEN_PEPPER:}
  session:
    access-expiry: ${ACCESS_TOKEN_EXPIRY:PT15M}
    refresh-expiry: ${REFRESH_TOKEN_EXPIRY:P30D}
    lock-duration: ${LOGIN_LOCK_DURATION:PT15M}
    maximum-failed-attempts: ${MAXIMUM_FAILED_LOGIN_ATTEMPTS:5}
  password-recovery:
    reset-expiry: ${PASSWORD_RESET_EXPIRY:PT15M}
    request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:PT1M}
    maximum-reset-attempts: ${MAXIMUM_PASSWORD_RESET_ATTEMPTS:5}
  mail:
    from-address: ${SMTP_FROM_ADDRESS:${SMTP_FROM:}}
    from-name: ${SMTP_FROM_NAME:Wealthora}
    development-directory: ${WEALTHORA_DEV_MAIL_DIR:./dev-mail}
  speech:
    project-id: ${GOOGLE_CLOUD_PROJECT:}
    maximum-audio-bytes: ${SPEECH_MAXIMUM_AUDIO_BYTES:1000000}
    minimum-audio-bytes: ${SPEECH_MINIMUM_AUDIO_BYTES:3200}
  google-oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
    flow-expiry: ${GOOGLE_OAUTH_FLOW_EXPIRY:PT3M}
