spring:
  datasource:
    url: jdbc:h2:mem:wealthora;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ""

logging:
  level:
    root: WARN
    org.hibernate.SQL: WARN

wealthora:
  registration:
    requires-admin-approval: true
    verification-expiry: PT10M
    resend-cooldown: PT1M
    maximum-verification-attempts: 5
  security:
    token-pepper: test-only-token-pepper-with-more-than-32-characters
  session:
    access-expiry: PT15M
    refresh-expiry: P30D
    lock-duration: PT15M
    maximum-failed-attempts: 5
  password-recovery:
    reset-expiry: PT15M
    request-cooldown: PT1M
    maximum-reset-attempts: 5
  mail:
    development-directory: ${java.io.tmpdir}/wealthora-test-mail
  speech:
    project-id: wealthora-voice
    maximum-audio-bytes: 1000000
    minimum-audio-bytes: 3200
  google-oauth:
    client-id: test-google-client.apps.googleusercontent.com
    client-secret: test-google-client-secret
    redirect-uri: http://127.0.0.1:9999/api/auth/google/callback
    flow-expiry: PT3M
