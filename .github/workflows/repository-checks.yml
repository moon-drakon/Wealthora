name: Repository Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject private or generated files
        shell: bash
        run: |
          set -euo pipefail

          blocked_files="$({
            git ls-files \
              | grep -E '(^|/)(\.env($|\.)|credentials([^/]*)?$|client_secret[^/]*\.json$|oauth-secret[^/]*\.json$|service[-_]?account[^/]*\.json$|id_(rsa|dsa|ecdsa|ed25519)(\.pub)?$|[^/]+\.(pem|p12|pfx|key)$)' \
              | grep -Ev '(^|/)\.env\.example$' || true
          })"
          if [[ -n "$blocked_files" ]]; then
            echo "Tracked private-file candidates:"
            printf '%s\n' "$blocked_files"
            exit 1
          fi

          generated_files="$(git ls-files | grep -E '(^|/)(build|dist|target|node_modules|\.next)/' || true)"
          if [[ -n "$generated_files" ]]; then
            echo "Tracked generated files:"
            printf '%s\n' "$generated_files"
            exit 1
          fi

          approved_jars='^(lib/flatlaf-3\.7\.2\.jar|lib/jbcrypt-0\.4\.jar|server/\.mvn/wrapper/maven-wrapper\.jar)$'
          unexpected_jars="$(git ls-files '*.jar' | grep -Ev "$approved_jars" || true)"
          if [[ -n "$unexpected_jars" ]]; then
            echo "Unexpected tracked JAR files:"
            printf '%s\n' "$unexpected_jars"
            exit 1
          fi

      - name: Scan tracked text for high-confidence secret signatures
        shell: bash
        run: |
          set -euo pipefail

          secret_pattern='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|AKIA[0-9A-Z]{16}|(jdbc:)?postgres(ql)?://[^/:[:space:]]+:[^@[:space:]]+@|"type"[[:space:]]*:[[:space:]]*"service_account"'
          matches="$(git grep -I -l -E -- "$secret_pattern" -- . || true)"
          if [[ -n "$matches" ]]; then
            echo "High-confidence secret signatures found in:"
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Check changed lines for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD
