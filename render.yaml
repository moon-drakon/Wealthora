services:
  - type: web
    name: wealthora-api
    runtime: docker
    plan: free
    branch: feature/shared-online-core
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: REGISTRATION_REQUIRES_ADMIN_APPROVAL
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: TOKEN_PEPPER
        generateValue: true
      - key: WEALTHORA_OWNER_NAME
        sync: false
      - key: WEALTHORA_OWNER_EMAIL
        sync: false
      - key: WEALTHORA_OWNER_PASSWORD
        sync: false
      - key: WEALTHORA_OWNER_CLAIM_TOKEN
        sync: false
