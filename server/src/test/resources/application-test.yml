spring:
  datasource:
    url: jdbc:h2:mem:wealthora;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ""

logging:
  level:
    root: WARN
    org.hibernate.SQL: WARN

wealthora:
  registration:
    requires-admin-approval: true
    verification-expiry: PT10M
    resend-cooldown: PT1M
    maximum-verification-attempts: 5
  security:
    token-pepper: test-only-token-pepper-with-more-than-32-characters
  session:
    access-expiry: PT15M
    refresh-expiry: P30D
    lock-duration: PT15M
    maximum-failed-attempts: 5
  password-recovery:
    reset-expiry: PT15M
    request-cooldown: PT1M
  mail:
    development-directory: ${java.io.tmpdir}/wealthora-test-mail
