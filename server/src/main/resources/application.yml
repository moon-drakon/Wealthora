spring:
  application:
    name: wealthora-auth-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wealthora}
    username: ${DATABASE_USERNAME:wealthora}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

wealthora:
  registration:
    requires-admin-approval: ${REGISTRATION_REQUIRES_ADMIN_APPROVAL:true}
    verification-expiry: PT10M
    resend-cooldown: PT1M
    maximum-verification-attempts: 5
  security:
    token-pepper: ${TOKEN_PEPPER:}
  mail:
    from: ${SMTP_FROM:}
    development-directory: ${WEALTHORA_DEV_MAIL_DIR:./dev-mail}
