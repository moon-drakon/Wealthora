spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 0.0.0.0
  port: ${PORT:10000}
  shutdown: graceful
  forward-headers-strategy: framework

wealthora:
  registration:
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:false}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.jdbc.core: WARN
